[package]
name = "bcde-tagger"
version = "0.1.0"
edition = "2021"
description = "Fast POS tagging and homograph disambiguation for Brazilian Portuguese"
authors = ["BCDE"]
license = "MIT"
repository = "https://github.com/bcdeosce/BCDE-tagger"
readme = "README.md"
keywords = ["nlp", "pos-tagger", "portuguese", "linguistics"]
categories = ["text-processing", "science"]

[[bin]]
name = "bcde-tagger"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
